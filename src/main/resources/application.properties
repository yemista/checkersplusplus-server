# Checkers++ server configuration.
#
# Every secret is read from the environment. Nothing sensitive belongs in this file --
# it is in version control. Values with a ":default" work out of the box for local
# development; the ones without a default are required and the app will refuse to start
# without them, which is deliberate.
#
# See deploy/checkersplusplus.env.example for the full list.

# ---------------------------------------------------------------- datasource

spring.datasource.url=${CPP_DB_URL:jdbc:postgresql://localhost:5432/checkersplusplus}
spring.datasource.username=${CPP_DB_USERNAME:checkersplusplus}
spring.datasource.password=${CPP_DB_PASSWORD}

spring.datasource.hikari.minimumIdle=${CPP_DB_POOL_MIN:10}
spring.datasource.hikari.maximumPoolSize=${CPP_DB_POOL_MAX:20}
spring.datasource.hikari.connectionTimeout=50000

spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# validate fails fast on a schema mismatch instead of silently altering a live database.
# Set CPP_DDL_AUTO=update only when you deliberately want Hibernate to change the schema.
spring.jpa.hibernate.ddl-auto=${CPP_DDL_AUTO:validate}

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.show_sql=false

# ---------------------------------------------------------------- web

server.port=${CPP_SERVER_PORT:8080}
server.servlet.session.timeout=300s
server.tomcat.connection-timeout=600s

# TLS terminates at nginx, so the application speaks plain HTTP behind it and needs no
# keystore. These two lines make Spring trust the proxy's forwarded headers so it sees
# the original scheme and client IP.
server.ssl.enabled=false
server.forward-headers-strategy=FRAMEWORK

spring.jackson.default-property-inclusion=NON_NULL

# ---------------------------------------------------------------- mail

spring.mail.host=${CPP_MAIL_HOST:send.smtp.com}
spring.mail.properties.mail.smtp.port=${CPP_MAIL_PORT:2525}
spring.mail.username=${CPP_MAIL_USERNAME}
spring.mail.password=${CPP_MAIL_PASSWORD}

# ---------------------------------------------------------------- game timing

# How long an idle session survives without a heartbeat before the sweeper retires it.
checkersplusplus.timeout.minutes=${CPP_TIMEOUT_MINUTES:15}
# How long the player on the clock may take to move while still connected.
checkersplusplus.timeout.move.minutes=${CPP_MOVE_TIMEOUT_MINUTES:3}
# Shorter deadline applied only when the player on the clock has dropped their websocket.
# Set to 0 to disable disconnect forfeits and rely on the move deadline alone.
checkersplusplus.timeout.disconnect.seconds=${CPP_DISCONNECT_TIMEOUT_SECONDS:30}

# ---------------------------------------------------------------- jobs

org.jobrunr.dashboard.enabled=false
org.jobrunr.background-job-server.enabled=false

# ---------------------------------------------------------------- logging

logging.level.root=${CPP_LOG_LEVEL:INFO}
logging.file.name=${CPP_LOG_FILE:logs/checkersplusplus.log}
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{100} - %msg%n
logging.logback.rollingpolicy.max-file-size=10MB
logging.level.org.springframework=ERROR
logging.level.org.springframework.orm.jpa=ERROR
logging.level.org.springframework.transaction=ERROR
logging.level.org.hibernate=ERROR
logging.level.org.apache=ERROR
logging.level.org.postgresql=ERROR
logging.level.sun.net.www=ERROR
logging.level.com.zaxxer=ERROR
logging.level.jdk.event.security=ERROR
